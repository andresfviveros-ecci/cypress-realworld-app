services:
  app:
    image: node:22.20.0
    working_dir: /app
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      HUSKY: "0"
      NODE_ENV: development
      PORT: "3000"
      VITE_BACKEND_PORT: "3001"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command:
      - bash
      - -lc
      - yarn install --frozen-lockfile --ignore-scripts && yarn patch-package && yarn db:seed:dev && yarn concurrently "vite --host 0.0.0.0 --port 3000" "yarn start:api"

volumes:
  app_node_modules:
